name: who-data-gate

# Mechanical gate blocking pre-publication WHO CC influenza data (strain names,
# amino-acid substitutions, clade tokens, or any private-list strain) from landing
# in this PUBLIC repo — in file contents OR commit messages.
# See tools/WHO-DATA-GATE.md. This check must stay green; do not bypass it.
#
# Both steps use --redact: these logs are public, so a finding is reported by location
# and rule only, never by the matched value. No --strict: CI has no private strain list,
# and --strict fails on its absence by design.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --range needs the history

      - name: Scan tracked file contents at the tip
        run: python3 tools/who-data-gate.py --all --quiet --redact

      # The tip scan cannot see data that one pushed commit added and a later one removed —
      # it still ships in the history. --range scans every commit on its own: the blobs it
      # touched and its message.
      - name: Scan every commit in this push / PR (files and messages)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --quiet origin "$BASE_REF"
            RANGE="origin/$BASE_REF..$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$AFTER"
          else
            # A new branch or tag, a force-push whose old tip is gone, or a manual run:
            # scan what is not already on the default branch. Never the whole history —
            # commits from before the gate existed carry data the baseline covers only at
            # the tip.
            git fetch --quiet origin "$DEFAULT_BRANCH"
            RANGE="origin/$DEFAULT_BRANCH..$AFTER"
          fi
          echo "Scanning every commit in: $RANGE"
          python3 tools/who-data-gate.py --range "$RANGE" --redact
